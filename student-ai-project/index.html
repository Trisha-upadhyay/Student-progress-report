<!DOCTYPE html>
<html>
<head>
  <title>Student AI Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
    }

    label {
      font-size: 14px;
    }

    input {
      width: 100%;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>📊 Student Predictor</h2>

  <label>Attendance</label>
  <input type="range" id="attendance" min="0" max="100">

  <label>Study Hours</label>
  <input type="range" id="study" min="0" max="10">

  <label>Assignment</label>
  <input type="range" id="assign" min="0" max="100">

  <label>LMS Logins</label>
  <input type="range" id="lms" min="0" max="20">

  <button onclick="predict()">Predict</button>

  <div class="result" id="result"></div>
</div>

<script>
async function predict() {
  let attendance = document.getElementById("attendance").value;
  let study = document.getElementById("study").value;
  let assign = document.getElementById("assign").value;
  let lms = document.getElementById("lms").value;

  const res = await fetch("http://127.0.0.1:5000/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({attendance, study, assign, lms})
  });

  const data = await res.json();

  document.getElementById("result").innerHTML =
    "Grade: " + data.score + "<br>Risk: " + data.risk;
}
</script>

</body>
</html>
